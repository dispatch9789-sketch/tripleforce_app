# Fly.io deployment configuration
# Docs: https://fly.io/docs/languages-and-frameworks/python/
# Deploy: fly launch --no-deploy && fly secrets set SECRET_KEY=$(openssl rand -hex 32) && fly deploy

app = "tripleforce-logistic"
primary_region = "ewr"  # Newark, NJ — closest to your market

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[http_service.concurrency]
  type = "requests"
  soft_limit = 100
  hard_limit = 250

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Persistent volume for SQLite (if not using external Postgres):
[[mounts]]
  source = "tripleforce_data"
  destination = "/app/data"

# Set secrets via CLI:
# fly secrets set SECRET_KEY=$(openssl rand -hex 32)
# fly secrets set MAIL_USERNAME=dispatch@tripleforcelogistic.com
# fly secrets set MAIL_PASSWORD=your-app-password
