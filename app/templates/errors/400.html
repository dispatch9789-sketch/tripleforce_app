{% extends "base.html" %}
{% block title %}Request Error{% endblock %}
{% block content %}
<div class="text-center py-5">
    <i class="bi bi-exclamation-triangle" style="font-size: 4rem; color: var(--tf-warning);"></i>
    <h1 class="page-title mt-3">400 — Bad Request</h1>
    <p class="text-muted">{{ reason or "Your request could not be processed." }}</p>
    <p class="text-muted small">If this was a form submission, the security token may have expired. Please go back and try again.</p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-tf-primary mt-2"><i class="bi bi-house"></i> Back to Dashboard</a>
</div>
{% endblock %}
